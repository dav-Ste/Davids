# Davids Staging / Nightly — Schemathesis v4.32.x OpenAPI Property-Based & Stateful Fuzzing Configuration
# Exercised locally via .\scripts\security\staging-nightly\Scan-Schemathesis.ps1 and in CI via .github/workflows/staging-nightly.yml

continue-on-failure = true
max-redirects = 0
request-timeout = 10
rate-limit = "auto"

[generation]
max-examples = 50
allow-x00 = true
unique-inputs = true

[checks]
enabled = true

[phases]
examples.enabled = true
coverage.enabled = true
fuzzing.enabled = true
stateful.enabled = true

# OAuth 2.1 /connect/token requires single-use cryptographic authorization codes issued by
# interactive /connect/authorize + PKCE S256 verification; synthetic codes must always return 400.
# OpenIddict also rejects undeclared HTTP verbs on /connect/* with RFC 6749 400 invalid_request (ID2084).
[[operations]]
include-path-regex = "/connect/(token|userinfo)$"

[operations.checks]
positive_data_acceptance.enabled = false
unsupported_method.enabled = false

# Customer sign-up intentionally returns 400/409 (email_in_use) when stateful links replay an already-registered
# userId or email (preserving the Davids Identity domain contract).
[[operations]]
include-path-regex = "(^|/identity)/sign-up$"

[operations.checks]
positive_data_acceptance.enabled = false

# Self-service password and email rotation endpoints require re-verification of the caller's live
# currentPassword; synthetic generated passwords must always return 400 (invalid_credentials).
[[operations]]
include-path-regex = "/me/(password|email)$"

[operations.checks]
positive_data_acceptance.enabled = false

# Customer registration completion (POST /customers) is a one-shot state transition from Incomplete -> Valid;
# repeating POST /customers for an already-registered customer intentionally returns 400/409.
# /customers also shares one URL path across `customers-customer` (POST) and `customers-admin` (GET),
# so HTTP 405 responses legitimately advertise `Allow: GET, POST` across both realm slices.
# Self-service /customers/me returns 404 before registration completion or 200 afterward.
[[operations]]
include-path-regex = "^/customers$"

[operations.checks]
allow_header_conformance.enabled = false

[[operations]]
include-path-regex = "^/customers$"
include-method = "POST"

[operations.checks]
positive_data_acceptance.enabled = false
allow_header_conformance.enabled = false

[[operations]]
include-path-regex = "^/customers/me$"

[operations.checks]
positive_data_acceptance.enabled = false

# Resource-by-UUID endpoints reject non-owner synthetic UUIDs with 403 (CustomerBearer tenant isolation)
# or unseeded random UUIDs with 404 (AdminBearer); OpenAPI stateful links exercise valid owner/seeded UUIDs.
[[operations]]
include-path-regex = "^/(identity|admin-identity|customer-accounts)/users/\\{userId\\}"

[operations.checks]
positive_data_acceptance.enabled = false

[[operations]]
include-path-regex = "^/customers/\\{customerId\\}"

[operations.checks]
positive_data_acceptance.enabled = false

# Product creation returns 409 Conflict when stateful/fuzzing replays a duplicate SKU;
# product-by-UUID endpoints return 404 on unseeded random UUIDs or 409 when negative stock delta exceeds stock.
[[operations]]
include-path-regex = "^/products$"
include-method = "POST"

[operations.checks]
positive_data_acceptance.enabled = false

[[operations]]
include-path-regex = "^/products/(admin/)?\\{productId\\}"

[operations.checks]
positive_data_acceptance.enabled = false

# Basket item upsert verifies live catalog existence and stock via Products API; synthetic random productIds
# intentionally return 404 (product_unavailable) or 409 (insufficient_stock).
[[operations]]
include-path-regex = "^/baskets/me/items$"

[operations.checks]
positive_data_acceptance.enabled = false

# Checkout requires a non-empty server-side basket (subsequent calls after checkout/clear return 400 empty_basket);
# order-by-UUID and payment-by-orderId endpoints return 404 on random synthetic orderIds or 409 on completed orders.
[[operations]]
include-path-regex = "^/orders/checkout$"

[operations.checks]
positive_data_acceptance.enabled = false

[[operations]]
include-path-regex = "^/orders/(me/)?\\{orderId\\}"

[operations.checks]
positive_data_acceptance.enabled = false

[[operations]]
include-path-regex = "^/payments/(me/)?order/\\{orderId\\}"

[operations.checks]
positive_data_acceptance.enabled = false
