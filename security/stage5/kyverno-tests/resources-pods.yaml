apiVersion: v1
kind: Pod
metadata:
  name: compliant-davids-api-gateway-with-istio
  namespace: davids
  labels:
    app: api-gateway
    sidecar.istio.io/inject: "true"
spec:
  serviceAccountName: davids-api-gateway
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api-gateway
      image: ghcr.io/davids/davids-api-gateway@sha256:1111111111111111111111111111111111111111111111111111111111111111
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tmp
          mountPath: /tmp
    - name: istio-proxy
      image: docker.io/istio/proxyv2@sha256:2222222222222222222222222222222222222222222222222222222222222222
      securityContext:
        runAsNonRoot: true
        runAsUser: 1337
        runAsGroup: 1337
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
---
