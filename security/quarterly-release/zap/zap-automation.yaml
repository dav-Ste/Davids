---
# Davids Platform — Quarterly / Release Full Active/Passive DAST & OpenAPI Security Plan
# Tool: OWASP ZAP 2.17.0 Automation Framework (Apache-2.0)
# Container: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
env:
  contexts:
    - name: "Davids-Gateway"
      urls:
        - "${ZAP_TARGET_URL}"
      includePaths:
        - "${ZAP_TARGET_URL}.*"
      excludePaths:
        - "${ZAP_TARGET_URL}/logout.*"
        - "${ZAP_TARGET_URL}/auth/logout.*"
        - "${ZAP_TARGET_URL}/customer-auth/logout.*"
        - "${ZAP_TARGET_URL}/identity/connect/logout.*"
        - "${ZAP_TARGET_URL}/identity/connect/revocation.*"
        - "${ZAP_TARGET_URL}/admin-identity/connect/logout.*"
        - "${ZAP_TARGET_URL}/admin-identity/connect/revocation.*"
      technology:
        exclude:
          - "Db.MySQL"
          - "Db.PostgreSQL"
          - "Db.Oracle"
          - "Db.MongoDB"
          - "Language.PHP"
          - "Language.JSP/Servlet"
          - "Language.Ruby"
          - "OS.MacOS"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      scanOnlyInScope: true
      enableTags: false

  # Loopback-only HTTP CI allowances: in ephemeral CI the gateway listens on plain HTTP
  # (http://localhost:17320 / http://127.0.0.1:17320), whereas production terminates TLS at
  # Istio IngressGateway. Scoped strictly to loopback HTTP so staging/production HTTPS targets
  # still enforce 10105 (RFC 6749 Basic challenge over cleartext) and 10106 (HTTP Only Site).
  - type: alertFilter
    alertFilters:
      - ruleId: 10105
        newRisk: "Info"
        context: "Davids-Gateway"
        url: "^http://(localhost|127\\.0\\.0\\.1)(:\\d+)?/(admin-)?identity/connect/token.*"
        urlRegex: true
      - ruleId: "10105-2"
        newRisk: "Info"
        context: "Davids-Gateway"
        url: "^http://(localhost|127\\.0\\.0\\.1)(:\\d+)?/(admin-)?identity/connect/token.*"
        urlRegex: true
      - ruleId: 10106
        newRisk: "Info"
        context: "Davids-Gateway"
        url: "^http://(localhost|127\\.0\\.0\\.1)(:\\d+)?/.*"
        urlRegex: true

  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: "Inject Customer RS256 Bearer token for Customer Identity routes"
        url: "^${ZAP_TARGET_URL}/identity/(me|users)(/.*|\\?.*)?$"
        matchType: "req_header"
        matchString: "Authorization"
        matchRegex: false
        replacementString: "${ZAP_CUSTOMER_BEARER_HEADER}"
      - description: "Inject Admin RS256 Bearer token for Workforce Customer-Accounts routes"
        url: "^${ZAP_TARGET_URL}/customer-accounts(/.*|\\?.*)?$"
        matchType: "req_header"
        matchString: "Authorization"
        matchRegex: false
        replacementString: "${ZAP_ADMIN_BEARER_HEADER}"
      - description: "Inject Admin RS256 Bearer token for Admin Identity management routes"
        url: "^${ZAP_TARGET_URL}/admin-identity/(me|users|login-audits|change-audits|audit)(/.*|\\?.*)?$"
        matchType: "req_header"
        matchString: "Authorization"
        matchRegex: false
        replacementString: "${ZAP_ADMIN_BEARER_HEADER}"
      - description: "Inject Customer RS256 Bearer token for Customer Self-Service Profile routes"
        url: "^${ZAP_TARGET_URL}/customers/me(/.*|\\?.*)?$"
        matchType: "req_header"
        matchString: "Authorization"
        matchRegex: false
        replacementString: "${ZAP_CUSTOMER_BEARER_HEADER}"
      - description: "Inject Admin RS256 Bearer token for Customers management routes"
        url: "^${ZAP_TARGET_URL}/customers(/(?!me(?:/|$|\\?)).*|\\?.*)?$"
        matchType: "req_header"
        matchString: "Authorization"
        matchRegex: false
        replacementString: "${ZAP_ADMIN_BEARER_HEADER}"

  - type: requestor
    parameters:
      user: ""
    requests:
      - url: "${ZAP_TARGET_URL}/login"
        name: "Admin-BFF-Login-Entry"
        method: "GET"
      - url: "${ZAP_TARGET_URL}/portal/login"
        name: "Customer-BFF-Login-Entry"
        method: "GET"
      - url: "${ZAP_TARGET_URL}/identity/.well-known/openid-configuration"
        name: "Customer-OIDC-Discovery"
        method: "GET"
      - url: "${ZAP_TARGET_URL}/admin-identity/.well-known/openid-configuration"
        name: "Admin-OIDC-Discovery"
        method: "GET"
      - url: "${ZAP_TARGET_URL}/identity/.well-known/jwks"
        name: "Customer-OIDC-JWKS"
        method: "GET"
      - url: "${ZAP_TARGET_URL}/admin-identity/.well-known/jwks"
        name: "Admin-OIDC-JWKS"
        method: "GET"

  - type: openapi
    parameters:
      apiFile: "/zap/wrk/specs/identity.restler.openapi.json"
      targetUrl: "${ZAP_TARGET_URL}"
      context: "Davids-Gateway"

  - type: openapi
    parameters:
      apiFile: "/zap/wrk/specs/admin-identity.restler.openapi.json"
      targetUrl: "${ZAP_TARGET_URL}"
      context: "Davids-Gateway"

  - type: openapi
    parameters:
      apiFile: "/zap/wrk/specs/customers.restler.openapi.json"
      targetUrl: "${ZAP_TARGET_URL}"
      context: "Davids-Gateway"

  - type: spider
    parameters:
      context: "Davids-Gateway"
      url: "${ZAP_TARGET_URL}/login"
      maxDuration: 3
      parseComments: true
      parseRobotsTxt: false

  - type: spider
    parameters:
      context: "Davids-Gateway"
      url: "${ZAP_TARGET_URL}/portal/login"
      maxDuration: 3
      parseComments: true
      parseRobotsTxt: false

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: "Davids-Gateway"
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 12
      threadPerHost: 4
    policyDefinition:
      rules:
        # Disable headless-browser DOM XSS (server-rendered static HTML with strict CSP script-src 'self')
        # and alpha/script active scan wrappers (100043 SwaggerSecretDetector.js GraalJS, 50000).
        - id: 40026
          threshold: "Off"
        - id: 50000
          threshold: "Off"
        - id: 100043
          threshold: "Off"

  - type: report
    parameters:
      template: "sarif-json"
      reportDir: "/zap/wrk/reports"
      reportFile: "zap-quarterly-release.sarif"
      reportTitle: "Davids Quarterly/Release OWASP ZAP Full Security Report (SARIF)"
      reportDescription: "Quarterly/Release active + passive + OpenAPI DAST scan across Davids YARP Gateway"

  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk/reports"
      reportFile: "zap-quarterly-release.json"
      reportTitle: "Davids Quarterly/Release OWASP ZAP Full Security Report (JSON)"

  - type: report
    parameters:
      template: "traditional-html-plus"
      reportDir: "/zap/wrk/reports"
      reportFile: "zap-quarterly-release.html"
      reportTitle: "Davids Quarterly/Release OWASP ZAP Full Security Report (HTML)"

  - type: exitStatus
    parameters:
      errorLevel: "Medium"
      warnLevel: "Low"
      okExitValue: 0
      errorExitValue: 1
      warnExitValue: 0
    alwaysRun: true
