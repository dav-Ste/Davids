# Production Cluster — Kyverno Admission Control: Hardened Non-Root Pod Security, Immutable Digests & Istio Mesh Sidecar Guard
# Free ($0) CNCF Apache-2.0 policy enforcing restricted container security posture across the davids namespace.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: davids-pod-security-and-mesh-admission
  annotations:
    policies.kyverno.io/title: Enforce Non-Root Read-Only Digest-Pinned Pods & Istio Sidecar Injection
    policies.kyverno.io/category: Pod Security & Zero-Trust Mesh
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Rejects any Pod in the davids namespace that uses :latest tags, omits immutable @sha256:
      digests, runs as root or UID < 10000 (excluding Istio's UID 1337 proxy/init containers),
      allows privilege escalation, mounts a writable root filesystem, uses host namespaces or
      hostPath volumes, automounts Kubernetes ServiceAccount tokens, or disables Istio sidecar injection.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-latest-and-require-sha256-digest
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - davids
      validate:
        message: "Every container image in namespace 'davids' must be pinned to an immutable '@sha256:' digest and must never use ':latest'."
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ element.image }}"
                    operator: NotEquals
                    value: "*@sha256:*"

    - name: require-non-root-high-uid
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - davids
      validate:
        message: "Application containers in namespace 'davids' must set runAsNonRoot=true and runAsUser>=10000 (Istio proxy UID 1337 is permitted solely for istio-proxy/istio-validation)."
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions:
              all:
                - key: "{{ element.name }}"
                  operator: NotIn
                  value:
                    - istio-proxy
                    - istio-validation
            pattern:
              securityContext:
                runAsNonRoot: true
                runAsUser: ">=10000"
                runAsGroup: ">=10000"

    - name: require-readonly-rootfs-drop-all-caps-and-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - davids
      validate:
        message: "Application containers in namespace 'davids' must enforce allowPrivilegeEscalation=false, readOnlyRootFilesystem=true, capabilities.drop=['ALL'], and seccompProfile.type=RuntimeDefault."
        foreach:
          - list: "request.object.spec.containers[]"
            preconditions:
              all:
                - key: "{{ element.name }}"
                  operator: NotIn
                  value:
                    - istio-proxy
                    - istio-validation
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                =(privileged): false
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL

    - name: disallow-host-namespaces-and-hostpath
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - davids
      validate:
        message: "Pods in namespace 'davids' must not enable hostNetwork, hostPID, hostIPC, or mount hostPath volumes."
        pattern:
          spec:
            =(hostNetwork): false
            =(hostPID): false
            =(hostIPC): false
            =(volumes):
              - X(hostPath): "null"

    - name: disallow-serviceaccount-token-automount
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - davids
      validate:
        message: "Pods in namespace 'davids' must set spec.automountServiceAccountToken=false."
        pattern:
          spec:
            automountServiceAccountToken: false

    - name: disallow-istio-sidecar-bypass
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - davids
      validate:
        message: "Disabling Istio mTLS sidecar injection (sidecar.istio.io/inject='false' or label) is prohibited in namespace 'davids'."
        pattern:
          =(metadata):
            =(annotations):
              =(sidecar.istio.io/inject): "!false"
            =(labels):
              =(sidecar.istio.io/inject): "!false"
