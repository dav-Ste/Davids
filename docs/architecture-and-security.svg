<text x="832" y="675" class="small">:5012  ·  Simulated payment capture</text>
<rect x="832" y="696" width="320" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="845" y="722" class="mono">paymentsdb</text>
<rect x="1200" y="618" width="352" height="140" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
<text x="1216" y="648" class="head">Davids.Shared</text>
<text x="1216" y="676" class="small">ServiceDefaults: observability,</text>
<text x="1216" y="698" class="small">security and resilience</text>
<text x="48" y="802" class="section">ASYNCHRONOUS CHECKOUT AND SHARED INFRASTRUCTURE</text>
<rect x="48" y="820" width="1504" height="115" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="856" class="head">RabbitMQ event flow</text>
<text x="70" y="887" class="body">Orders: order_placed   →   Payments: simulated capture / failure   →   Orders: outcome</text>
<text x="70" y="913" class="small">order_completed is consumed by Customers, Products and Baskets; delivery relies on configured messaging.</text>
<rect x="48" y="957" width="1504" height="150" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
<text x="70" y="992" class="head">Davids  ·  Aspire AppHost, bootstrap and deployment manifests</text>
<text x="70" y="1022" class="body">SQL Server hosts the seven distinct databases; the development AppHost also provisions RabbitMQ.</text>
<text x="70" y="1048" class="body">Redis, Vault, Jaeger, Seq, Prometheus and Grafana are configuration-dependent integrations.</text>
<text x="70" y="1074" class="small">Kubernetes / Istio policies apply when deployed and enforced; local Aspire is not an Istio mesh.</text>
<rect x="48" y="1130" width="1504" height="133" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="1165" class="head">Security boundaries</text>
<text x="70" y="1195" class="body">Customer and workforce accounts use separate identity databases, OIDC schemes and authorization policies.</text>
<text x="70" y="1222" class="body">The portals share an origin: paths alone do not isolate them from same-origin XSS.</text>
<text x="70" y="1247" class="small">Use the configured gateway endpoint for browser access; direct service ports are local development defaults.</text>
</svg>