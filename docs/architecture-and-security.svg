<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330" role="img" aria-labelledby="title desc">
<title id="title">Davids platform: twelve repositories and seven service databases</title>
<desc id="desc">Two browser portals connect through the gateway to seven backend services. Each service owns a database. RabbitMQ supports asynchronous checkout and the infrastructure repository provides Aspire and deployment configuration.</desc>
<rect width="1600" height="1330" fill="#f8fafc"/>
<style>text {font-family:Segoe UI,Arial,sans-serif;fill:#0f172a} .title{font-size:35px;font-weight:700} .sub{font-size:17px;fill:#475569} .section{font-size:14px;letter-spacing:2px;font-weight:700;fill:#64748b} .head{font-size:22px;font-weight:700} .cardhead{font-size:18px;font-weight:700} .body{font-size:16px;fill:#475569} .small{font-size:14px;fill:#475569} .mono{font-family:Consolas,monospace;font-size:15px;fill:#1d4ed8} .tag{font-size:13px;font-weight:700;letter-spacing:.3px;fill:#059669} </style>
