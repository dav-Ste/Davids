<text x="64" y="675" class="small">:5008  ·  Customer shopping baskets</text>
<rect x="64" y="696" width="320" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="77" y="722" class="mono">basketsdb</text>
