<text x="448" y="675" class="small">:5010  ·  Checkout and order lifecycle</text>
<rect x="448" y="696" width="320" height="40" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="461" y="722" class="mono">ordersdb</text>
<rect x="816" y="618" width="352" height="140" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
