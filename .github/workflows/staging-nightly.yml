          STATUS_NUCLEI_SCAN: ${{ steps.nuclei_scan.outcome }}
          STATUS_DASTARDLY_SCAN: ${{ steps.dastardly_scan.outcome }}
        run: |
          {
            echo "## Nightly security scan summary"
            echo "- Target: ${TARGET_KIND:-not resolved}"
            echo "- Davids workflow revision: ${WORKFLOW_REVISION}"
            echo "- Optional commerce fixture: ${FIXTURE_STATUS:-not attempted or target setup failed}"
            echo "- Outcomes: success, failure, skipped, or not run (the latter can include jobs interrupted before this step)."
            echo ""
            echo "| Scan suite | Outcome |"
            echo "|---|---|"
            echo "| Unauthenticated API contracts | ${STATUS_UNAUTH_FUZZ:-not run} |"
            echo "| Customer Identity | ${STATUS_CUSTOMER_IDENTITY_FUZZ:-not run} |"
            echo "| Customer Customers | ${STATUS_CUSTOMER_CUSTOMERS_FUZZ:-not run} |"
            echo "| Customer Baskets | ${STATUS_CUSTOMER_BASKETS_FUZZ:-not run} |"
            echo "| Customer Orders | ${STATUS_CUSTOMER_ORDERS_FUZZ:-not run} |"
            echo "| Customer Payments | ${STATUS_CUSTOMER_PAYMENTS_FUZZ:-not run} |"
            echo "| Workforce Customer Accounts | ${STATUS_ADMIN_CUSTOMER_ACCOUNTS_FUZZ:-not run} |"
            echo "| Workforce AdminIdentity | ${STATUS_ADMIN_IDENTITY_FUZZ:-not run} |"
            echo "| Workforce Customers | ${STATUS_ADMIN_CUSTOMERS_FUZZ:-not run} |"
            echo "| Workforce Products | ${STATUS_ADMIN_PRODUCTS_FUZZ:-not run} |"
            echo "| Workforce Orders | ${STATUS_ADMIN_ORDERS_FUZZ:-not run} |"
            echo "| Workforce Payments | ${STATUS_ADMIN_PAYMENTS_FUZZ:-not run} |"
            echo "| Nuclei | ${STATUS_NUCLEI_SCAN:-not run} |"
            echo "| Dastardly | ${STATUS_DASTARDLY_SCAN:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"

