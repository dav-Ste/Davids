          WORKFLOW_REVISION: ${{ github.sha }}
          STATUS_UNAUTH_FUZZ: ${{ steps.unauth_fuzz.outcome }}
          STATUS_CUSTOMER_IDENTITY_FUZZ: ${{ steps.customer_identity_fuzz.outcome }}
          STATUS_CUSTOMER_CUSTOMERS_FUZZ: ${{ steps.customer_customers_fuzz.outcome }}
          STATUS_CUSTOMER_BASKETS_FUZZ: ${{ steps.customer_baskets_fuzz.outcome }}
          STATUS_CUSTOMER_ORDERS_FUZZ: ${{ steps.customer_orders_fuzz.outcome }}
