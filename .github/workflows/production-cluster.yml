name: Production Cluster — Policy & Configuration Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-cluster-policy-and-alert-verification:
    name: Kyverno, Istio, Runtime Rules & Alert Configuration Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Davids
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Run offline policy and configuration verification
        shell: pwsh
        run: ./scripts/security/production-cluster/Verify-ProductionClusterGates.ps1 -InstallTools

  cosign-keyless-signing-and-sbom:
    name: Conditional Image Signing & SBOM Attestation
    if: github.event_name == 'push' && vars.ENABLE_COSIGN_SIGNING == 'true'
    needs: [production-cluster-policy-and-alert-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Davids
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false

      - name: Install Sigstore Cosign CLI
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.2

      - name: Generate CycloneDX SBOM for release provenance
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: davids-release.cdx.json
          upload-artifact: false

      - name: Sign & attest immutable image digest via GitHub OIDC + Fulcio + Rekor
        if: vars.RELEASE_IMAGE_DIGEST != ''
        env:
          IMAGE_DIGEST_REF: ${{ vars.RELEASE_IMAGE_DIGEST }}
        run: |
          cosign sign --yes "${IMAGE_DIGEST_REF}"
          cosign attest --yes --predicate davids-release.cdx.json --type cyclonedx "${IMAGE_DIGEST_REF}"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/[^/]+/Davids.*" \
            "${IMAGE_DIGEST_REF}"
