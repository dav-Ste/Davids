name: CodeQL — PR, Main & Weekly SAST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "25 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event.repository.private != true || vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout Davids repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Davids

      - name: Checkout Davids.Shared
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Shared
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Shared

      - name: Checkout Davids.Services.Identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Services.Identity
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Services.Identity

      - name: Checkout Davids.Services.AdminIdentity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Services.AdminIdentity
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Services.AdminIdentity

      - name: Checkout Davids.Services.Customers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Services.Customers
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Services.Customers

      - name: Checkout Davids.Services.Products
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Services.Products
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Services.Products

      - name: Checkout Davids.Services.Baskets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Services.Baskets
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Services.Baskets

      - name: Checkout Davids.Services.Orders
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Services.Orders
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Services.Orders

      - name: Checkout Davids.Services.Payments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Services.Payments
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Services.Payments

      - name: Checkout Davids.APIGateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.APIGateway
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.APIGateway

      - name: Checkout Davids.Frontend.Admin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Frontend.Admin
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Frontend.Admin

      - name: Checkout Davids.Frontend.Web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/Davids.Frontend.Web
          token: ${{ secrets.CROSS_REPO_READ_TOKEN || github.token }}
          path: Davids.Frontend.Web

      - name: Setup .NET 10 SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./Davids/security/pull-request-ci/codeql/codeql-config.yml

      - name: Build Davids.slnx for CodeQL extraction
        if: matrix.language == 'csharp'
        run: |
          set -euo pipefail
          for sln in \
            ./Davids.Shared/Davids.Shared.slnx \
            ./Davids.Services.Identity/Davids.Services.Identity.slnx \
            ./Davids.Services.AdminIdentity/Davids.Services.AdminIdentity.slnx \
            ./Davids.Services.Customers/Davids.Services.Customers.slnx \
            ./Davids.Services.Products/Davids.Services.Products.slnx \
            ./Davids.Services.Baskets/Davids.Services.Baskets.slnx \
            ./Davids.Services.Orders/Davids.Services.Orders.slnx \
            ./Davids.Services.Payments/Davids.Services.Payments.slnx \
            ./Davids.APIGateway/Davids.APIGateway.slnx \
            ./Davids.Frontend.Admin/Davids.Frontend.Admin.slnx \
            ./Davids.Frontend.Web/Davids.Frontend.Web.slnx \
            ./Davids/src/Davids.Bootstrap/Davids.Bootstrap.csproj; do
            dotnet restore "$sln" --locked-mode -m:1 -nr:false --tl:off
          done
          dotnet restore ./Davids/Davids.slnx -m:1 -nr:false --tl:off
          dotnet build ./Davids/Davids.slnx --no-restore -c Release -warnaserror -m:2 -nr:false --tl:off

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          checkout_path: ./Davids
